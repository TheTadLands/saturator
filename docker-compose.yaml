version: '3.8'

services:
  # Baseline experiment - 2 CPU cores
  saturator-baseline:
    build: .
    command: ["baseline"]
    cpus: 2.0
    mem_limit: 512m
    profiles: ["baseline"]
  
  # Add CPU experiment - 2 cores + extra threads
  saturator-add-cpu:
    build: .
    command: ["add-cpu", "2"]
    cpus: 2.0
    mem_limit: 512m
    profiles: ["add-cpu"]
  
  # Add I/O experiment - 2 cores
  saturator-add-io:
    build: .
    command: ["add-io", "4"]
    cpus: 2.0
    mem_limit: 512m
    tmpfs:
      - /tmp:size=1G  # Limit I/O to tmpfs with size limit
    profiles: ["add-io"]

  # Custom experiment
  saturator-custom:
    build: .
    command: ["baseline"]  # Override at runtime
    cpus: 2.0
    mem_limit: 512m
    profiles: ["custom"]